services:
  db:
    image: postgres:16
    container_name: carvoeiro-manager-db
    environment:
      POSTGRES_DB: carvoeiro-manager
      POSTGRES_USER: carvoeiro-manager
      POSTGRES_PASSWORD: carvoeiro-manager
    ports:
      # Loopback-only host port 5435 -> container 5432: the password above is public, and 5435 avoids
      # clashing with other local Postgres containers.
      - "127.0.0.1:5435:5432"
    volumes:
      - carvoeiro-manager-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carvoeiro-manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carvoeiro-manager-pgdata:
